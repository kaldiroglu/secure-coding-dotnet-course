name: Dependency security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

jobs:
  vulnerable-packages:
    name: Vulnerable NuGet packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SecureCoding.NetBackend.sln

      - name: Check for vulnerable packages (direct + transitive)
        run: |
          set -euo pipefail
          report=$(dotnet list SecureCoding.NetBackend.sln package --vulnerable --include-transitive 2>&1)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi
          echo "No vulnerable packages."
